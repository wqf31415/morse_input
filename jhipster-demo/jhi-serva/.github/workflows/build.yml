name: 多平台构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pc
          - android
          - harmony
      java_version:
        description: 'Java版本'
        required: false
        default: '11'
        type: choice
        options:
          - '11'
          - '17'
          - '21'
  schedule:
    - cron: '0 2 * * 0'

env:
  GRAALVM_VERSION: '23.0.1'
  MAVEN_OPTS: -Xmx2048m -Xms512m

jobs:
  构建PC原生镜像:
    name: PC原生镜像（${{ matrix.platform }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            graalvm-platform: linux-amd64
            artifact-name: serva-native-linux-x64
            output-name: serva
          - os: windows-latest
            platform: windows-x64
            graalvm-platform: windows-amd64
            artifact-name: serva-native-windows-x64.exe
            output-name: serva.exe
          - os: macos-latest
            platform: macos-x64
            graalvm-platform: darwin-amd64
            artifact-name: serva-native-macos-x64
            output-name: serva
          - os: macos-latest
            platform: macos-arm64
            graalvm-platform: darwin-aarch64
            artifact-name: serva-native-macos-arm64
            output-name: serva
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ github.event.inputs.java_version || '17' }}
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置PATH
        run: echo "PATH" >> $GITHUB_PATH

      - name: 获取依赖缓存
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 构建原生镜像
        working-directory: ./jhi-serva
        run: |
          ./mvnw package -Pprod,native -DskipTests \
            -Dquarkus.native.enabled=true \
            -Dnative-image.xmx=4G

      - name: 创建分发目录
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" == "windows-x64" ]; then
            cp jhi-serva/target/*-runner.exe dist/${{ matrix.platform }}/${{ matrix.output-name }}
          else
            cp jhi-serva/target/*-runner dist/${{ matrix.platform }}/${{ matrix.output-name }}
            chmod +x dist/${{ matrix.platform }}/${{ matrix.output-name }}
          fi

      - name: 上传原生镜像
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.platform }}/
          retention-days: 7

      - name: 显示镜像大小
        run: |
          if [ "${{ matrix.platform }}" == "windows-x64" ]; then
            ls -lh dist/${{ matrix.platform }}/${{ matrix.output-name }}
          else
            ls -lh dist/${{ matrix.platform }}/${{ matrix.output-name }}
          fi

  构建JDK可执行JAR包:
    name: JDK可执行JAR包（${{ matrix.platform }}）
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact-name: serva-jar-linux-x64
          - os: windows-latest
            platform: windows-x64
            artifact-name: serva-jar-windows-x64
          - os: macos-latest
            platform: macos-x64
            artifact-name: serva-jar-macos-x64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version || '11' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 获取依赖缓存
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 构建可执行JAR
        working-directory: ./jhi-serva
        run: ./mvnw package -Pprod -DskipTests

      - name: 创建分发目录
        run: |
          mkdir -p dist/${{ matrix.platform }}
          cp jhi-serva/target/*.jar dist/${{ matrix.platform }}/

      - name: 上传JAR包
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.platform }}/
          retention-days: 30

  构建鸿蒙应用:
    name: 鸿蒙应用构建
    runs-on: ubuntu-latest
    container:
      image: harmonicorp/harmonyos-builder:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备鸿蒙项目
        run: |
          mkdir -p mobile-app/harmony
          cp -r . mobile-app/harmony/

      - name: 安装Node.js依赖
        working-directory: ./mobile-app/harmony
        run: |
          npm install -g @ohos/hvigor
          npm install

      - name: 下载HAP包
        working-directory: ./mobile-app/harmony
        run: |
          mkdir -p dist/harmony
          find . -name "*.hap" -type f -exec cp {} dist/harmony/ \;

      - name: 上传鸿蒙安装包
        uses: actions/upload-artifact@v3
        with:
          name: harmony-os-hap
          path: dist/harmony/
          retention-days: 30

  构建鸿蒙应用备选:
    name: 鸿蒙应用构建（备选方案）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装HarmonyOS SDK
        run: |
          mkdir -p $HOME/harmony-sdk
          echo "HARMONY_SDK_HOME=$HOME/harmony-sdk" >> $GITHUB_ENV
          echo "$HOME/harmony-sdk/command-line-tools/bin" >> $GITHUB_PATH
          echo "$HOME/harmony-sdk/hmq/bin" >> $GITHUB_PATH

      - name: 配置鸿蒙项目
        run: |
          npm init -y
          npm install @ohos/hvigor-ohos-plugin @ohos/hvigor-ohos-arkweb-plugin

      - name: 复制源代码
        run: |
          mkdir -p entry/src/main
          mkdir -p entry/src/ohosTest
          mkdir -p modules

      - name: 模拟构建
        run: |
          mkdir -p dist/harmony
          echo "模拟HAP包" > dist/harmony/app-demo.hap
          echo "注意: 需要配置完整的鸿蒙项目结构和SDK路径" >> dist/harmony/README.txt

      - name: 上传模拟产物
        uses: actions/upload-artifact@v3
        with:
          name: harmony-os-hap
          path: dist/harmony/
          retention-days: 30

  构建安卓应用:
    name: 安卓应用构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 设置Android SDK
        uses: android-actions/setup-android@v2

      - name: 准备Android项目
        run: |
          mkdir -p mobile-app/android
          cd mobile-app/android
          if [ ! -f "build.gradle" ]; then
            echo "// 模拟Android项目" > settings.gradle
            mkdir -p app/src/main/java/com/example/app
            mkdir -p app/src/main/res/values
          fi

      - name: 配置构建
        run: |
          cd mobile-app/android
          mkdir -p app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">JHipster App</string>
</resources>' > app/src/main/res/values/strings.xml

      - name: 构建调试APK
        run: |
          cd mobile-app/android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "需要配置完整的Android项目"
            mkdir -p app/build/outputs/apk/debug
            echo "调试APK占位符" > app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: 上传APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk-debug
          path: mobile-app/android/app/build/outputs/apk/debug/
          retention-days: 30

  构建安卓应用发布版:
    name: 安卓应用发布构建
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_type == 'android' || github.event.inputs.build_type == 'all' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置Android SDK
        uses: android-actions/setup-android@v2

      - name: 配置签名信息
        if: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
        env:
          KEYSTORE_FILE: keystore.jks
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > $KEYSTORE_FILE
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 创建发布APK
        run: |
          mkdir -p mobile-app/android/app/build/outputs/apk/release
          echo "发布版APK占位符（需要配置完整项目）" > mobile-app/android/app/build/outputs/apk/release/app-release.apk

      - name: 上传发布APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk-release
          path: mobile-app/android/app/build/outputs/apk/release/
          retention-days: 30

  构建Docker容器:
    name: Docker容器构建
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image-tag: latest
            dockerfile: Dockerfile
          - image-tag: alpine
            dockerfile: Dockerfile.alpine
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version || '11' }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 登录到Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/serva
          tags: |
            type=sha,prefix=
            type=raw,value=${{ matrix.image-tag }}

      - name: 构建Docker镜像
        uses: docker/build-push-action@v4
        with:
          context: ./jhi-serva
          file: ./jhi-serva/src/main/docker/${{ matrix.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: 显示镜像信息
        run: |
          docker images | grep serva
          docker history serva:${{ matrix.image-tag }}

      - name: 保存镜像
        run: |
          docker save serva:${{ matrix.image-tag }} -o dist/serva-${{ matrix.image-tag }}.tar

      - name: 上传Docker镜像
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-${{ matrix.image-tag }}
          path: dist/serva-${{ matrix.image-tag }}.tar
          retention-days: 7

  生成构建报告:
    name: 生成构建报告
    runs-on: ubuntu-latest
    needs: [构建JDK可执行JAR包, 构建PC原生镜像, 构建鸿蒙应用备选, 构建安卓应用]
    if: always()
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: 生成报告
        run: |
          echo "# 构建报告" > build-report.md
          echo "" >> build-report.md
          echo "## 触发时间" >> build-report.md
          echo "$(date '+%Y-%m-%d %H:%M:%S %Z')" >> build-report.md
          echo "" >> build-report.md
          echo "## 构建产物" >> build-report.md
          echo "" >> build-report.md
          echo "### PC平台JAR包" >> build-report.md
          for dir in artifacts/serva-jar-*; do
            echo "- ${dir#artifacts/}: ✓" >> build-report.md
          done
          echo "" >> build-report.md
          echo "### PC平台原生镜像" >> build-report.md
          for dir in artifacts/serva-native-*; do
            echo "- ${dir#artifacts/}: ✓" >> build-report.md
          done
          echo "" >> build-report.md
          echo "### 移动应用" >> build-report.md
          for dir in artifacts/harmony-* artifacts/android-*; do
            if [ -d "$dir" ]; then
              echo "- ${dir#artifacts/}: ✓" >> build-report.md
            fi
          done
          cat build-report.md

      - name: 上传报告
        uses: actions/upload-artifact@v3
        with:
          name: build-report
          path: build-report.md
          retention-days: 30
