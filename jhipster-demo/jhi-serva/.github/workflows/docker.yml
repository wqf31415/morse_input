name: Docker镜像构建与发布

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签'
        required: false
        default: 'latest'
        type: string
      build_args:
        description: '构建参数 (格式: KEY=VALUE,多值用逗号分隔)'
        required: false
        default: ''
        type: string

env:
  JAVA_VERSION: '11'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/serva

jobs:
  准备环境:
    name: 准备构建环境
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      is_release: ${{ steps.vars.outputs.is_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置变量
        id: vars
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "is_release=${{ startsWith(github.ref, 'refs/tags/v') }}" >> $GITHUB_OUTPUT

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=-${{ steps.vars.outputs.short_sha }}
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

  构建JVM镜像:
    name: 构建JVM镜像
    runs-on: ubuntu-latest
    needs: 准备环境
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 获取依赖缓存
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 登录到注册表
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 构建JVM镜像
        uses: docker/build-push-action@v4
        with:
          context: ./jhi-serva
          push: ${{ needs.准备环境.outputs.is_release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            GIT_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: 生成镜像摘要
        run: |
          echo "## JVM镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images --format '{{.Repository}}:{{.Tag}} ({{.Size}})' | grep ${{ env.IMAGE_NAME }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  构建JRE精简镜像:
    name: 构建JRE精简镜像
    runs-on: ubuntu-latest
    needs: 准备环境
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 登录到注册表
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
          flavors: |
            - slim

      - name: 构建JRE精简镜像
        uses: docker/build-push-action@v4
        with:
          context: ./jhi-serva
          push: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:slim
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.准备环境.outputs.short_sha }}-slim
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            GIT_COMMIT=${{ github.sha }}
            JDK_OR_JRE=jre
          platforms: linux/amd64,linux/arm64
          load: true

      - name: 显示镜像大小
        run: |
          echo "## JRE精简镜像大小" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images --format '{{.Repository}}:{{.Tag}} ({{.Size}})' | grep "${{ env.IMAGE_NAME }}:slim" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  构建Alpine镜像:
    name: 构建Alpine镜像
    runs-on: ubuntu-latest
    needs: 准备环境
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 登录到注册表
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
          flavors: |
            - alpine

      - name: 构建Alpine镜像
        uses: docker/build-push-action@v4
        with:
          context: ./jhi-serva
          push: ${{ needs.准备环境.outputs.is_release }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:alpine
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.准备环境.outputs.short_sha }}-alpine
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            GIT_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  多架构镜像扫描:
    name: Docker镜像安全扫描
    runs-on: ubuntu-latest
    needs: [构建JVM镜像, 构建Alpine镜像]
    if: ${{ needs.准备环境.outputs.is_release == 'true' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录到注册表
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像
        run: |
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.准备环境.outputs.short_sha }}

      - name: 运行Trivy扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.准备环境.outputs.short_sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: 上传扫描结果
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 生成扫描报告
        run: |
          echo "## Docker镜像安全扫描" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**扫描镜像**: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.准备环境.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "扫描结果已上传至Security标签页" >> $GITHUB_STEP_SUMMARY

  发布HelmChart:
    name: 发布Helm Chart
    runs-on: ubuntu-latest
    needs: [构建JVM镜像, 构建多架构镜像扫描]
    if: ${{ needs.准备环境.outputs.is_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: 创建Helm Chart
        run: |
          mkdir -p helm/serva
          cat > helm/serva/Chart.yaml << 'EOF'
          apiVersion: v2
          name: serva
          description: A JHipster application
          type: application
          version: ${GITHUB_REF_NAME#v}
          appVersion: ${GITHUB_REF_NAME#v}
          kubeVersion: ">=1.19.0"
          keywords:
            - jhipster
            - spring-boot
          dependencies:
            - name: postgresql
              version: ~12.x.x
              repository: https://charts.bitnami.com/bitnami
          EOF

          cat > helm/serva/values.yaml << 'EOF'
          image:
            repository: ghcr.io/${{ github.repository_owner }}/serva
            tag: latest
            pullPolicy: IfNotPresent
            pullSecrets: []
          replicaCount: 1
          service:
            type: ClusterIP
            port: 8081
          ingress:
            enabled: true
            className: nginx
            annotations: {}
            hosts:
              - host: serva.local
                paths:
                  - path: /
                    pathType: Prefix
          resources:
            limits:
              memory: 1Gi
              cpu: 1000m
            requests:
              memory: 512Mi
              cpu: 100m
          autoscaling:
            enabled: false
          EOF

          cat > helm/serva/templates/_helpers.tpl << 'EOF'
          {{/*
          Expand the name of the chart.
          */}}
          {{- define "serva.name" -}}
          {{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
          {{- end }}

          {{/*
          Create a default fully qualified app name.
          */}}
          {{- define "serva.fullname" -}}
          {{- if .Values.fullnameOverride }}
          {{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
          {{- else }}
          {{- $name := default .Chart.Name .Values.nameOverride }}
          {{- if contains $name .Release.Name }}
          {{- .Release.Name | trunc 63 | trimSuffix "-" }}
          {{- else }}
          {{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
          {{- end }}
          {{- end }}
          {{- end }}
          EOF

      - name: 打包Helm Chart
        run: |
          helm package helm/serva --version ${GITHUB_REF_NAME#v}
          mkdir -p gh-pages
          mv serva-${GITHUB_REF_NAME#v}.tgz gh-pages/

      - name: 更新索引
        uses: actions/download-artifact@v3
        with:
          name: helm-index
          path: gh-pages/
        continue-on-error: true

      - name: 生成索引
        run: |
          cd gh-pages
          helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/charts
          cd ..

      - name: 提交并推送
        run: |
          git checkout --orphan gh-pages
          git add gh-pages/*
          git commit -m "Release ${{ github.ref_name }}"
          git push origin gh-pages --force

      - name: 生成发布说明
        run: |
          echo "## Helm Chart 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${GITHUB_REF_NAME#v}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装命令" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add serva https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/charts" >> $GITHUB_STEP_SUMMARY
          echo "helm install serva serva/serva --version ${GITHUB_REF_NAME#v}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  生成发布摘要:
    name: 生成发布摘要
    runs-on: ubuntu-latest
    needs: [构建JVM镜像, 构建JRE精简镜像, 构建Alpine镜像, 发布HelmChart]
    if: always()
    steps:
      - name: 生成摘要
        run: |
          echo "# Docker镜像构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**触发时间**: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 可用镜像标签" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\` - 最新稳定版" >> $GITHUB_STEP_SUMMARY
          echo "- \`slim\` - JRE精简版" >> $GITHUB_STEP_SUMMARY
          echo "- \`alpine\` - Alpine Linux版" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.准备环境.outputs.short_sha }}\` - 特定提交版本" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 镜像地址" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
